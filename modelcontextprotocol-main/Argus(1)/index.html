<style>
  html, body { margin: 0; padding: 0; background: #07080a; }
  /* ---- Wireframe base tokens (per-artboard scopes override accent) ---- */
  :root {
    --ink-0: #0e0d0b;
    --ink-1: #1d1b18;
    --ink-2: #3a362f;
    --ink-3: #6b665d;
    --ink-4: #a09a8e;
    --ink-5: #c9c4b8;
    --ink-6: #e6e2d8;
    --ink-7: #f3f0e6;
    --paper: #faf8f1;
  }
  /* Subtle wireframe placeholder for "image goes here" */
  .ph-image {
    background:
      repeating-linear-gradient(135deg, transparent 0 8px, rgba(0,0,0,.05) 8px 9px),
      var(--ink-7);
    display: flex; align-items: center; justify-content: center;
    color: var(--ink-3);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase;
  }
</style>
