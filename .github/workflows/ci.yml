name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  argus:
    name: argus · typecheck · test · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: argus
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: argus/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  companions:
    name: ${{ matrix.pkg }} · build · test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg: [argus-bridge, argus-proxy]
    defaults:
      run:
        working-directory: ${{ matrix.pkg }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: ${{ matrix.pkg }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
